[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-watchdog"
version = "0.1.0"
description = "Pre-kickoff availability alerts for fantasy-football lineups"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
]

[project.scripts]
fantasy-watchdog = "app.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["app*"]
